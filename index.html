<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Open Redirect — Proof of Concept</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            color: #101d35;
        }

        .container {
            width: 90%;
            max-width: 900px;
            text-align: center;
            padding: 50px 20px;
        }

        .alien {
            width: min(420px, 85%);
            height: auto;
            display: block;
            margin: 0 auto 35px;
        }

        h1 {
            margin: 0 0 25px;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 750;
            letter-spacing: -2px;
        }

        .description {
            max-width: 760px;
            margin: 0 auto 30px;
            color: #536174;
            font-size: 1.25rem;
            line-height: 1.6;
        }

        .simulation {
            margin: 0 auto 20px;
            color: #258044;
            font-size: 1.25rem;
            font-weight: 700;
        }

        .privacy {
            color: #536174;
            font-size: 1.05rem;
            margin-bottom: 35px;
        }

        .divider {
            width: 190px;
            height: 2px;
            background: #e4e8ee;
            margin: 0 auto 28px;
        }

        .credit {
            color: #101d35;
            font-size: 1.15rem;
        }
    </style>
</head>

<body>

    <main class="container">

        <img
            src="alien.png"
            alt="Friendly alien in a UFO"
            class="alien"
        >

        <h1>Open Redirect — Proof of Concept</h1>

        <p class="description">
            This page demonstrates that the application redirected the browser
            to an external domain controlled by TEOS.
        </p>

        <p class="simulation">
            This is a complete and inoffensive phishing simulation.
        </p>

        <p class="privacy">
            No credentials or personal information were collected.
        </p>

        <div class="divider"></div>

        <div class="credit">
            by Ron - TEOS Team
        </div>

    </main>

</body>
</html>
