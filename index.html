
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Redirect — Proof of Concept</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #0f1f3d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    .container {
      width: min(900px, 92%);
      text-align: center;
      padding: 50px 20px;
    }

    .alien {
      display: block;
      width: min(520px, 90%);
      height: auto;
      margin: 0 auto 28px;
      border-radius: 16px;
    }

    h1 {
      margin: 0 0 22px;
      font-size: clamp(2rem, 5vw, 3.4rem);
      line-height: 1.1;
      font-weight: 750;
      letter-spacing: -0.03em;
    }

    .description {
      max-width: 760px;
      margin: 0 auto 30px;
      color: #536174;
      font-size: clamp(1.05rem, 2vw, 1.35rem);
      line-height: 1.6;
    }

    .simulation {
      margin: 0 auto 22px;
      color: #258044;
      font-size: clamp(1.05rem, 2vw, 1.3rem);
      font-weight: 700;
    }

    .privacy {
      color: #536174;
      font-size: 1.05rem;
      margin-bottom: 35px;
    }

    .divider {
      width: 190px;
      height: 2px;
      margin: 0 auto 28px;
      background: #e4e8ee;
    }

    .credit {
      font-size: 1.15rem;
      color: #0f1f3d;
    }
  </style>
</head>

<body>
  <main class="container">
    <img class="alien" src="alien.png" alt="Friendly alien in a UFO">

    <h1>Open Redirect — Proof of Concept</h1>

    <p class="description">
      This page demonstrates that the application redirected the browser
      to an external domain controlled by the tester.
    </p>

    <p class="simulation">
      This is a complete and inoffensive phishing simulation.
    </p>

    <p class="privacy">
      No credentials or personal information were collected.
    </p>

    <div class="divider"></div>

    <div class="credit">by Ron - TEOS Team</div>
  </main>
</body>
</html>
